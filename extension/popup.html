<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 380px; margin: 10px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #status { font-weight: 600; }
  .on { color: #1a7d32; } .wait { color: #a06c00; } .off { color: #777; }
  #err { color: #b00020; font-size: 12px; min-height: 0; }
  ol { margin: 0; padding: 0; list-style: none; max-height: 300px; overflow-y: auto; border-top: 1px solid #ddd; }
  li { padding: 4px 0; border-bottom: 1px solid #eee; font-size: 11.5px; word-break: break-all; }
  .t { color: #888; } .c { font-weight: 600; }
  a { font-size: 12px; }
  .code { background: #f3f3f5; border-radius: 6px; padding: 8px; margin-bottom: 10px; }
  .code button { font: 600 13px system-ui, sans-serif; padding: 5px 12px; cursor: pointer; }
  .code p { margin: 6px 0 0; font-size: 11.5px; color: #555; }
  #copied { color: #1a7d32; margin-left: 6px; }
</style>
</head>
<body>
  <h1>TabRelay</h1>
  <div class="row">
    <label><input type="checkbox" id="enabled"> Bridge enabled (kill switch)</label>
    <a href="#" id="opts">Options</a>
  </div>
  <div class="row"><span>Status: <span id="status">…</span></span></div>
  <div id="err"></div>
  <div id="src" style="color:#888;font-size:11.5px;margin-bottom:6px"></div>
  <div class="code">
    <button id="copy">Copy connection code</button>
    <span id="copied"></span>
    <p>Paste it into the TabRelay plugin settings in Claude, in the <b>Connection code</b> field.</p>
  </div>
  <h1>Recent actions</h1>
  <ol id="audit"></ol>
  <script src="popup.js"></script>
</body>
</html>
